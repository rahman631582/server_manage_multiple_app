server {
    listen 80;
    server_name _;

    # =================== TASK APP =================== #
    location /task {
        alias /var/www/taskapp/frontend/build;
        index index.html;
        try_files $uri $uri/ @taskapp;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }
    }

    location @taskapp {
        rewrite ^/task/(.*)$ /task/index.html last;
    }

    location /task/api {

        rewrite ^/task/api(/.*)$ $1 break;
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Timeout configurations
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }

    # =================== TODO APP =================== #
    location /todo {
        alias /var/www/todoapp/frontend/build;
        index index.html;
        try_files $uri $uri/ @todoapp;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }
    }

    location @todoapp {
        rewrite ^/todo/(.*)$ /todo/index.html last;
    }

    location /todo/api {
        rewrite ^/todo/api(/.*)$ $1 break;
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;


        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Timeout configurations
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }
}
